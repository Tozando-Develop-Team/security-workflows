# Reusable workflow: 週次の全件棚卸し
# 消費側リポは .github/workflows/security-weekly.yml で
#   schedule: - cron: "0 0 * * 1"  # 月曜 09:00 JST
# を設定して呼ぶ
#
# PR 時の差分スキャンとは別に、既存依存にも遡って棚卸しを行う

name: Weekly Security Scan (reusable)

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      project_label:
        required: true
        type: string
      upload_to_code_scanning:
        description: "SARIF を GitHub Code Scanning タブに転送するか (private リポは GHAS 課金が必要、default false)"
        required: false
        type: boolean
        default: false
    secrets:
      APPS_SCRIPT_URL:
        required: true
      APPS_SCRIPT_KEY:
        required: true

permissions:
  contents: read
  security-events: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. OSV-Scanner (全件 = 既存依存も含めて)
  # ──────────────────────────────────────────────────────────────
  osv-full:
    name: OSV-Scanner (全件)
    # Nested reusable workflow call — must be top-level jobs.*.uses, not a step
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.0
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      upload-sarif: ${{ inputs.upload_to_code_scanning }}
      fail-on-vuln: false
      scan-args: |-
        --recursive
        --skip-git
        ./

  # ──────────────────────────────────────────────────────────────
  # 2. Semgrep 全件 + 全カテゴリ
  # ──────────────────────────────────────────────────────────────
  semgrep-full:
    name: Semgrep (全 SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.95.0  # TODO: SHA pin at deploy via scripts/resolve-shas.sh
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Semgrep with broader rulesets
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/cwe-top-25 \
            --config=p/r2c-security-audit \
            --sarif --output=semgrep-full.sarif \
            --severity=ERROR --severity=WARNING || true

      - name: Forward to router
        if: always()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
          SCAN_TYPE: weekly-semgrep
        run: |
          .github/scripts/post-sarif.sh semgrep-full.sarif "$PROJECT" "$SCAN_TYPE" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 3. gitleaks (履歴全体) — 公式 Action は組織で有料化されたためバイナリ直叩き
  # ──────────────────────────────────────────────────────────────
  gitleaks-history:
    name: gitleaks (全履歴)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "PIN_AFTER_FIRST_RUN"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install gitleaks binary
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          curl -fsSL -o "${ASSET}" "${URL}"
          if [ "${GITLEAKS_SHA256}" != "PIN_AFTER_FIRST_RUN" ]; then
            echo "${GITLEAKS_SHA256}  ${ASSET}" | sha256sum -c -
          fi
          tar xzf "${ASSET}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (detect, 全履歴)
        run: |
          set +e
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks-history.sarif \
            --redact \
            --no-banner \
            --exit-code 2
          rc=$?
          echo "gitleaks exit=${rc}"
          exit 0

      - name: Upload SARIF (GHAS only)
        if: always() && inputs.upload_to_code_scanning && hashFiles('gitleaks-history.sarif') != ''
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: gitleaks-history.sarif
          category: gitleaks-history

      - name: Forward to router
        if: always() && hashFiles('gitleaks-history.sarif') != ''
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-sarif.sh gitleaks-history.sarif "$PROJECT" "weekly-gitleaks" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 4. Laravel 専用 (全件 SCA + taint)
  # ──────────────────────────────────────────────────────────────
  laravel-full:
    name: Laravel 全件 SAST
    if: inputs.stack == 'laravel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: composer audit (全件)
        run: composer audit --format=json > composer-audit-full.json || true

      - name: Psalm taint (全件・psalm.xml がコミットされているリポのみ)
        run: |
          if [ -f psalm.xml ] && [ -x vendor/bin/psalm ]; then
            vendor/bin/psalm --taint-analysis --no-progress --no-cache --report=psalm-full-sarif.sarif || true
          else
            echo "psalm.xml or vendor/bin/psalm が無いためスキップ (Psalm 未導入リポ)"
          fi

      - name: PHPCS Security Audit
        run: |
          composer require --dev squizlabs/php_codesniffer pheromone/phpcs-security-audit --no-progress
          vendor/bin/phpcs --standard=Security --report=json -p ./app ./routes ./database > phpcs-security.json || true

      - name: Forward to router
        if: always()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-audit.sh composer-audit-full.json "$PROJECT" "weekly-composer-audit" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 5. Next.js 専用 (全件 SCA + ESLint security)
  # ──────────────────────────────────────────────────────────────
  nextjs-full:
    name: Next.js 全件 SAST
    if: inputs.stack == 'nextjs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci --ignore-scripts

      - name: npm audit (全件)
        run: npm audit --json --audit-level=low > npm-audit-full.json || true

      - name: ESLint security 全件
        run: |
          if [ -f .eslintrc.security.cjs ] || [ -f .eslintrc.security.json ]; then
            npx eslint --config .eslintrc.security.cjs \
              --format json --output-file eslint-security-full.json \
              --no-error-on-unmatched-pattern \
              "**/*.{ts,tsx,js,jsx}" --ignore-pattern "node_modules" --ignore-pattern ".next" || true
          fi

      - name: Forward to router
        if: always()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-audit.sh npm-audit-full.json "$PROJECT" "weekly-npm-audit" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 6. Trivy (全件)
  # ──────────────────────────────────────────────────────────────
  trivy-full:
    name: Trivy (全件 fs + config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          format: "sarif"
          output: "trivy-fs-full.sarif"

      - name: Trivy config (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          output: "trivy-config-full.sarif"

  # ──────────────────────────────────────────────────────────────
  # 7. Weekly summary trigger (router 側で集計依頼)
  # ──────────────────────────────────────────────────────────────
  request-summary:
    name: 週次サマリ作成依頼
    needs: [osv-full, semgrep-full, gitleaks-history, trivy-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ping Apps Script for weekly summary
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          payload=$(jq -n \
            --arg project "$PROJECT" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{event: "weekly_summary_request", project: $project, run_url: $run_url, ts: now}')
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "$APPS_SCRIPT_KEY" | sed 's/^.* //')
          curl -sS -X POST "$APPS_SCRIPT_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
