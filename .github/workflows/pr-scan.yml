# Reusable workflow: PR 時の脆弱性スキャン
# 消費側リポは .github/workflows/security-pr.yml で `uses: Tozando-Develop-Team/security-workflows/.github/workflows/pr-scan.yml@<SHA>` で呼ぶ
#
# 検出対象:
#   - 依存パッケージ（OSV-Scanner で差分のみ報告）
#   - SAST パターン（Semgrep OSS）
#   - Secrets（gitleaks）
#   - Laravel リポは Psalm taint analysis + composer audit を追加
#   - Next.js リポは ESLint security + npm audit を追加
#
# 入力:
#   stack: "laravel" | "nextjs" | "static"
#   semgrep_config: 任意 (例 "p/owasp-top-ten p/javascript p/php")
#   apps_script_url: Apps Script Web App URL (secret 経由でも可)
#
# Secret:
#   APPS_SCRIPT_URL  : Apps Script Web App の公開 URL
#   APPS_SCRIPT_KEY  : 共有秘密鍵（HMAC 検証用）

name: PR Security Scan (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: "対象スタック (laravel | nextjs | static)"
        required: true
        type: string
      semgrep_config:
        description: "Semgrep 設定 (p/<ruleset> をスペース区切り)"
        required: false
        type: string
        default: "p/owasp-top-ten p/security-audit p/secrets"
      project_label:
        description: "Short project identifier (e.g. your-project-name)"
        required: true
        type: string
      upload_to_code_scanning:
        description: "SARIF を GitHub Code Scanning タブに転送するか (private リポは GHAS 課金が必要、default false)"
        required: false
        type: boolean
        default: false
    secrets:
      APPS_SCRIPT_URL:
        required: true
      APPS_SCRIPT_KEY:
        required: true

permissions:
  contents: read
  security-events: write   # SARIF アップロード用（Code scanning タブで可視化）
  pull-requests: write     # PR コメント用

concurrency:
  group: pr-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. OSV-Scanner (依存スキャン・差分モード)
  # ──────────────────────────────────────────────────────────────
  osv-diff:
    name: OSV-Scanner (差分)
    # Nested reusable workflow call — must be top-level jobs.*.uses, not a step
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.0
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      # upload-sarif は GHAS (Advanced Security) が有効な repo のみで成功するため既定 OFF
      upload-sarif: ${{ inputs.upload_to_code_scanning }}
      fail-on-vuln: false  # router 側で重大度判定するので step 自体は緑にする
      scan-args: |-
        --recursive
        --skip-git
        ./

  # ──────────────────────────────────────────────────────────────
  # 2. Semgrep (SAST)
  # ──────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.95.0  # TODO: pin to digest after first successful run
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        env:
          SEMGREP_RULES: ${{ inputs.semgrep_config }}
        run: |
          semgrep scan \
            --config "${SEMGREP_RULES// / --config }" \
            --sarif --output=semgrep.sarif \
            --severity=ERROR --severity=WARNING --severity=INFO \
            --error || true

      - name: Upload SARIF (GHAS only)
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always() && inputs.upload_to_code_scanning
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Forward to router
        if: always()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-sarif.sh semgrep.sarif "$PROJECT" "semgrep" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 3. gitleaks (Secrets) — 公式 Action は組織で有料化されたためバイナリ直叩き
  # ──────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (Secrets)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # 公式リリース zip の SHA256 (v8.30.1 linux_x64) — リリース固定で再現性確保
      GITLEAKS_SHA256: "PIN_AFTER_FIRST_RUN"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks binary
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          curl -fsSL -o "${ASSET}" "${URL}"
          # TODO: SHA256 検証を有効化（初回成功後に env.GITLEAKS_SHA256 を実値に差し替え）
          if [ "${GITLEAKS_SHA256}" != "PIN_AFTER_FIRST_RUN" ]; then
            echo "${GITLEAKS_SHA256}  ${ASSET}" | sha256sum -c -
          fi
          tar xzf "${ASSET}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (detect)
        id: gitleaks_detect
        run: |
          set +e
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --redact \
            --no-banner \
            --exit-code 2
          rc=$?
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          # exit 1 = leak found, 2 = error, 0 = clean. step は常に緑にして router で集約判定
          exit 0

      - name: Upload SARIF (GHAS only)
        if: always() && inputs.upload_to_code_scanning && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Forward to router
        if: always() && hashFiles('gitleaks.sarif') != ''
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-sarif.sh gitleaks.sarif "$PROJECT" "gitleaks" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 4. Laravel 専用 (composer audit + Psalm taint + Larastan)
  # ──────────────────────────────────────────────────────────────
  laravel:
    name: Laravel SAST (Psalm taint + Larastan)
    if: inputs.stack == 'laravel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: composer audit (SCA)
        run: composer audit --format=json > composer-audit.json || true

      - name: Psalm taint analysis (psalm.xml がコミットされているリポのみ)
        id: psalm_run
        run: |
          if [ -f psalm.xml ] && [ -x vendor/bin/psalm ]; then
            vendor/bin/psalm --taint-analysis --report=psalm-sarif.sarif --no-progress || true
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "psalm.xml or vendor/bin/psalm が無いためスキップ (Psalm 未導入リポ)"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Larastan
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            vendor/bin/phpstan analyse --error-format=json > larastan.json || true
          fi

      - name: Upload Psalm SARIF (GHAS only)
        if: always() && inputs.upload_to_code_scanning && steps.psalm_run.outputs.ran == 'true'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: psalm-sarif.sarif
          category: psalm-taint

      - name: Forward to router
        if: always()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-audit.sh composer-audit.json "$PROJECT" "composer-audit" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 5. Next.js 専用 (npm audit + ESLint security)
  # ──────────────────────────────────────────────────────────────
  nextjs:
    name: Next.js SAST (npm audit + ESLint security)
    if: inputs.stack == 'nextjs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (SCA)
        run: npm audit --json --audit-level=low > npm-audit.json || true

      - name: ESLint with security plugins
        run: |
          if [ -f .eslintrc.security.cjs ] || [ -f .eslintrc.security.json ]; then
            npx eslint --config .eslintrc.security.cjs \
              --format json \
              --output-file eslint-security.json \
              --no-error-on-unmatched-pattern \
              "src/**/*.{ts,tsx,js,jsx}" "app/**/*.{ts,tsx,js,jsx}" "pages/**/*.{ts,tsx,js,jsx}" || true
          else
            echo "No .eslintrc.security.cjs found, skipping ESLint security pass"
          fi

      - name: Forward to router
        if: always()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_KEY: ${{ secrets.APPS_SCRIPT_KEY }}
          PROJECT: ${{ inputs.project_label }}
        run: |
          .github/scripts/post-audit.sh npm-audit.json "$PROJECT" "npm-audit" \
            "${APPS_SCRIPT_URL}" "${APPS_SCRIPT_KEY}" || true

  # ──────────────────────────────────────────────────────────────
  # 6. Trivy (IaC + Dockerfile があれば)
  # ──────────────────────────────────────────────────────────────
  trivy:
    name: Trivy (IaC / Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          output: "trivy-fs.sarif"
          exit-code: "0"

      - name: Upload SARIF (GHAS only)
        if: always() && inputs.upload_to_code_scanning && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy
