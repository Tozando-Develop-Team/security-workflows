# 消費側 Laravel リポへドロップイン
# 配置場所: <consumer-repo>/.github/dependabot.yml

version: 2
updates:
  # Composer (PHP)
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      php-dev-deps:
        dependency-type: development
      php-runtime:
        dependency-type: production

  # npm (Laravel Mix / Vite フロント部分があれば)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  # GitHub Actions の SHA pin 更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions

  # Docker (Sail の base image)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
